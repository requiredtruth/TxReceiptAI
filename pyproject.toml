[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "txreceiptai"
version = "0.1.0"
description = "Deterministic, read-only EVM transaction receipt evidence"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "requiredtruth"}]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
]

[project.scripts]
txreceiptai = "txreceiptai.cli:main"

[tool.setuptools.packages.find]
include = ["txreceiptai*"]
